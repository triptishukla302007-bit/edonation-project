<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Don't Dump</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f8f5;
        }

        header {
            background: #2e7d32;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        h2 {
            text-align: center;
            color: #2e7d32;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            background: #2e7d32;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
        }

        .back {
            text-align: center;
            margin-top: 20px;
        }

        .back a {
            color: #2e7d32;
            text-decoration: none;
        }
    </style>
</head>

<body>

<header>
    <h1>Don't Dump</h1>
    <p>e-Donation System</p>
</header>

<div class="container">

    <h2>Create Account</h2>

    <form action="/register" method="POST">

        <label>Full Name</label>
        <input type="text" name="name" placeholder="Enter your name" required>

        <label>Email</label>
        <input type="email" name="email" placeholder="Enter your email" required>

        <label>Mobile Number</label>
        <input type="tel" name="mobile" placeholder="Enter your mobile number" required>

        <label>Password</label>
        <input type="password" name="password" placeholder="Create a password" required>

        <button type="submit">Register</button>

    </form>

    <div class="back">
        <a href="/">← Back to Home</a>
    </div>

</div>

</body>
</html>
